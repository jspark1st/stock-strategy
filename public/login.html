<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#141311"/>
<title>easystock · 로그인</title>
<style>
  :root{--bg:#141311;--surface:#1c1b19;--surface2:#242220;--border:#393836;
    --text:#e8e6e3;--muted:#9a9996;--accent:#4f98a3;--caution:#dd6974}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;
    display:grid;place-items:center;padding:20px;
    font-family:system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif}
  .box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);
    border-radius:16px;padding:32px 26px;text-align:center}
  .brand{font-size:1.5rem;font-weight:800;margin-bottom:2px}
  .sub{font-size:.78rem;color:var(--muted);margin-bottom:22px}
  label{display:block;text-align:left;font-size:.82rem;color:var(--muted);margin-bottom:6px}
  input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
    color:var(--text);padding:12px 14px;font:inherit;font-size:1rem;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;
    padding:12px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  .err{color:var(--caution);font-size:.82rem;margin-bottom:12px;min-height:1.1em}
  .foot{font-size:.72rem;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
  <form class="box" method="POST" action="/api/login">
    <div class="brand">📊 easystock</div>
    <div class="sub">by junaitech</div>
    <div class="err" id="err"></div>
    <label for="password">비밀번호</label>
    <input type="password" id="password" name="password" autocomplete="current-password"
           autofocus required placeholder="비밀번호를 입력하세요"/>
    <button type="submit">들어가기</button>
    <div class="foot">투자 판단의 참고 자료이며 투자 권유가 아님.</div>
  </form>
<script>
  if (new URLSearchParams(location.search).get('e')) {
    document.getElementById('err').textContent = '비밀번호가 올바르지 않습니다.';
  }
</script>
</body>
</html>

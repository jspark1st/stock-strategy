    <rect x="104" y="287" width="69" height="87" rx="5" fill="#f15553"/>
    <line x1="256" y1="169" x2="256" y2="348" stroke="#ffd9a8" stroke-width="11"/>
    <rect x="221" y="205" width="69" height="107" rx="5" fill="#ff7a70"/>
    <line x1="374" y1="95" x2="374" y2="277" stroke="#ffd9a8" stroke-width="11"/>
    <rect x="339" y="128" width="69" height="113" rx="5" fill="#fbb219"/>
  </g>
  <!-- 초승달 (오버나이트) -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="준스탁">
  <defs>
    <linearGradient id="bg" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#258a92"/>
      <stop offset="1" stop-color="#0b2b30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.24" r="0.62">
      <stop offset="0" stop-color="#3da8b0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3da8b0" stop-opacity="0"/>
    </radialGradient>
    <mask id="moon">
      <circle cx="389" cy="120" r="59" fill="#fff"/>
      <circle cx="410" cy="105" r="55" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="512" height="512" rx="120" fill="url(#glow)"/>
  <!-- 상승 캔들 3 (한국 상승=빨강) -->
